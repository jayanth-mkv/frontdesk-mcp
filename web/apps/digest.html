<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Focus Digest</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  /* shadcn/ui zinc (dark), to match the Echo Show. */
  :root { --bg:#09090b; --card:#18181b; --border:#27272a; --ink:#fafafa; --muted:#a1a1aa; --brand:#38bdf8; --ok:#34d399; --warn:#fbbf24; --bad:#f87171; }
  * { box-sizing: border-box; }
  body { margin:0; font: 15px/1.45 "Geist", system-ui, sans-serif; color:var(--ink); background:var(--bg); padding:16px 20px; -webkit-font-smoothing: antialiased; }
  h1 { display:flex; align-items:center; gap:6px; font-size: 12px; font-weight: 500; color: var(--muted); margin: 0 0 4px; }
  h1 svg { color: var(--brand); }
  .headline { font-size: 19px; font-weight: 600; letter-spacing: -.02em; line-height: 1.3; margin: 0 0 12px; }
  .stats { display:grid; grid-template-columns: repeat(3, 1fr); gap:10px; margin-bottom: 12px; }
  .stat { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:10px 14px; }
  .stat b { display:block; font-size:24px; font-weight:600; letter-spacing:-.02em; }
  .stat span { color:var(--muted); font-size:12px; }
  ul { list-style:none; margin:0; padding:0; display:grid; gap:6px; }
  li { display:flex; gap:12px; align-items:flex-start; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:8px 12px; animation: in .35s ease both; }
  li .i { flex:none; width:28px; height:28px; border-radius:8px; display:grid; place-items:center; background:#27272a; color:#d4d4d8; }
  li.ask { border-color: #854d0e; background: #1c1608; }
  li.ask .i { background:#422006; color: var(--warn); }
  .actions { display:flex; gap:8px; margin-top:8px; }
  button { display:inline-flex; align-items:center; gap:6px; height:34px; border:1px solid transparent; border-radius:8px; padding:0 14px; font:500 14px "Geist", system-ui, sans-serif; cursor:pointer; }
  .yes { background:#fafafa; color:#18181b; } .yes:hover { background:#e4e4e7; }
  .no { background:transparent; color:var(--ink); border-color:#3f3f46; } .no:hover { background:#27272a; }
  @keyframes in { from { opacity:0; transform: translateY(6px);} }
</style>
</head>
<body>
  <h1><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 14h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7a9 9 0 0 1 18 0v7a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3"/></svg>FrontDesk · While you were focused</h1>
  <p class="headline" id="headline">Loading…</p>
  <div class="stats">
    <div class="stat"><b id="handled">0</b><span>handled for you</span></div>
    <div class="stat"><b id="blocked">0</b><span>suspicious blocked</span></div>
    <div class="stat"><b id="pending">0</b><span>need your OK</span></div>
  </div>
  <ul id="items"></ul>
<script>
  // Minimal MCP Apps (ui/*) client: speaks JSON-RPC over postMessage with the host.
  // Lucide icons (ISC license).
  const P = {
    delivery: '<path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/>',
    food: '<path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/>',
    booking: '<rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/>',
    shield: '<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="M12 8v4"/><path d="M12 16h.01"/>',
    info: '<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>',
    clock: '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
    check: '<path d="M20 6 9 17l-5-5"/>',
  };
  const ICON = (n, s = 16) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${P[n] || P.info}</svg>`;
  let nextId = 1; const waiting = new Map();
  const rpc = (method, params) => new Promise((resolve) => { const id = nextId++; waiting.set(id, resolve); parent.postMessage({ jsonrpc: "2.0", id, method, params }, "*"); });
  const notify = (method, params) => parent.postMessage({ jsonrpc: "2.0", method, params }, "*");

  function render(d) {
    if (!d) return;
    document.getElementById("headline").textContent = d.headline;
    document.getElementById("handled").textContent = d.handledCount;
    document.getElementById("blocked").textContent = d.blockedCount;
    document.getElementById("pending").textContent = d.pendingApprovals.length;
    const ul = document.getElementById("items"); ul.innerHTML = "";
    for (const it of d.items.filter((i) => !i.needsApproval)) {
      const li = document.createElement("li");
      li.innerHTML = `<span class="i">${ICON(it.icon)}</span><span></span>`;
      li.lastChild.textContent = it.text; ul.append(li);
    }
    for (const p of d.pendingApprovals) {
      const li = document.createElement("li"); li.className = "ask";
      li.innerHTML = `<span class="i">${ICON("clock")}</span><div><div></div><div class="actions"><button class="yes">${ICON("check", 15)}Approve</button><button class="no">Decline</button></div></div>`;
      li.querySelector("div > div").textContent = p.summary;
      li.querySelector(".yes").onclick = () => decide(p.id, true);
      li.querySelector(".no").onclick = () => decide(p.id, false);
      ul.append(li);
    }
  }
  async function decide(approvalId, approve) {
    await rpc("tools/call", { name: "resolve_approval", arguments: { approvalId, approve } });
    const r = await rpc("tools/call", { name: "get_focus_digest", arguments: {} });
    render(r && r.structuredContent);
  }
  window.addEventListener("message", (e) => {
    const m = e.data; if (!m || m.jsonrpc !== "2.0") return;
    if (m.id && waiting.has(m.id)) { waiting.get(m.id)(m.result); waiting.delete(m.id); return; }
    if (m.method === "ui/notifications/tool-result") render(m.params && m.params.structuredContent);
  });
  rpc("ui/initialize", { protocolVersion: "2026-01-26", appInfo: { name: "frontdesk-digest", version: "0.1.0" }, appCapabilities: {} })
    .then(() => notify("ui/notifications/initialized", {}));
</script>
</body>
</html>
